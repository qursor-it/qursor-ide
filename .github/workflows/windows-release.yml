# A `v*` tag push builds the signed NSIS installer and publishes it, with the
# updater's latest.json, to this repo's releases. That latest.json is what
# installed Windows builds poll (ADR-0087).
name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version v$version"
            exit 1
          fi
      - name: Check Windows bundle defaults
        run: pnpm windows:check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Makes vite.config.ts stamp the exact version instead of `<version>-dev`.
          FACTORAI_RELEASE: '1'
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Qursor IDE ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.release.conf.json
