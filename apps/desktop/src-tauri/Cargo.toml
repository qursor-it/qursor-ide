[package]
name = "qursor-ide"
version = "0.58.0"
description = "Qursor IDE"
edition = "2021"

[lib]
name = "factorai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qursor-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qursor-core = { path = "../../../crates/qursor-core" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
parking_lot = "0.12"
base64 = "0.22"
dashmap = "6"
# One call: `kill(-pid, SIGKILL)` to end an analysis process group
# (services/intelligence/provider). Already in the tree via tokio, so this makes
# an existing transitive dependency explicit rather than adding one.
libc = "0.2.186"
# No default features: they pull ssh2 / openssl / http transport in for network
# operations we never perform — every call reads a local repository (ADR-0009).
git2 = { version = "0.21", default-features = false }
tauri-plugin-updater = "2.10.1"
tauri-plugin-clipboard-manager = "2.3.2"
# Deleting a session moves its transcript to the OS trash rather than unlinking
# it (F2, ADR-0027) — `~/.local/share/Trash` per the freedesktop spec on Linux,
# Finder's Trash on macOS, both without a system dependency we do not already
# link. Default features stay off; the native Windows target explicitly enables
# COM initialization below (ADR-0074). `chrono` is only used when listing trash
# contents, whereas factorai only moves transcripts into it.
trash = { version = "5.2.6", default-features = false }
# The atomic half of `write_file` (F26): a named temp file in the target's own
# directory, `persist`ed over it. Doing this by hand means inventing a unique
# name, cleaning it up on every early return, and getting the rename right.
tempfile = "3"
# The opt-in Anthropic usage endpoint (usage monitor): one blocking GET on the
# poller thread. Default features (rustls); the body is parsed with serde_json,
# so no `json` feature.
ureq = "2"
# Decrypted SSH secrets are wiped from memory when dropped. Already in the tree.
zeroize = "1"
# Taskbar widget renderer (usage monitor): a CPU pixmap + glyph rasteriser, no GPU,
# no PNG codec in release builds.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"

# WebKitGTK's `web-process-terminated`, which is the only warning we get that
# the renderer has died (ADR-0059). The same version wry already builds — the
# `WebView` handle `with_webview` hands us is that crate's type, so a different
# major would not unify. Linux only: `WKWebView`'s equivalent is a delegate
# method wry does not surface.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

# Windows Recycle Bin calls initialize COM in native worker threads (ADR-0074).
[target.'cfg(windows)'.dependencies]
dunce = "1"
trash = { version = "5.2.6", default-features = false, features = ["coinit_multithreaded"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
# The usage widget's fallback when it cannot embed in the taskbar (ADR-0086): a
# Cargo feature of Tauri itself, not a plugin, and Windows only so Linux builds
# do not take on the appindicator dependency for an icon they never show.
tauri = { version = "2", features = ["tray-icon"] }

[dev-dependencies]
qursor-core = { path = "../../../crates/qursor-core", features = ["test-support"] }
# Only the tests write preview PNGs.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
regex = "1.13.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
