[package]
name = "qursor-ide"
version = "0.55.0"
description = "Qursor IDE"
edition = "2021"

[lib]
name = "factorai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "qursor-ide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
notify-debouncer-mini = "0.4"
parking_lot = "0.12"
base64 = "0.22"
portable-pty = "0.8"
dashmap = "6"
# One call: `kill(pid, 0)` to tell a live editor lockfile from a crashed one
# (services/ide/lockfile). Already in the tree via tokio and portable-pty, so
# this makes an existing transitive dependency explicit rather than adding one.
libc = "0.2.186"
# No default features: they pull ssh2 / openssl / http transport in for network
# operations we never perform — every call reads a local repository (ADR-0009).
git2 = { version = "0.21", default-features = false }
tauri-plugin-updater = "2.10.1"
tauri-plugin-clipboard-manager = "2.3.2"
# The IDE bridge's transport (F20, ADR-0017 § 4). No default features: those
# carry `connect` and four TLS backends, and this only ever *accepts* plaintext
# connections on loopback. `handshake` is the one piece we need — it is where
# the auth header is inspected before the socket is upgraded.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# `StreamExt` / `SinkExt` for the IDE bridge's socket. Already in the tree under
# tokio-tungstenite; named here because we call its traits directly. No default
# features — `async-await` and the executor helpers are not used.
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
# Cron parsing for routines (F22, ADR-0026 § 5). Takes the 5-field expressions
# people write, answers `find_next_occurrence`, and has *documented* DST rules —
# a fixed-time job runs at the first valid instant after a spring-forward gap and
# once only in a fall-back overlap (Q25). The scheduling half is ours: a crate
# that also owns execution has nowhere to put the cap, the queue, the overlap
# skip or coalesced catch-up.
croner = "3"
# Deleting a session moves its transcript to the OS trash rather than unlinking
# it (F2, ADR-0027) — `~/.local/share/Trash` per the freedesktop spec on Linux,
# Finder's Trash on macOS, both without a system dependency we do not already
# link. Default features stay off; the native Windows target explicitly enables
# COM initialization below (ADR-0074). `chrono` is only used when listing trash
# contents, whereas factorai only moves transcripts into it.
trash = { version = "5.2.6", default-features = false }
# Stable content hashes for Project Intelligence (F33, ADR-0084): a transcript
# event's fingerprint, an evidence id, and the file hash an instruction change is
# verified against. They are stored, so `DefaultHasher` (not stable across Rust
# versions) is not an option. Already in the tree through Tauri; this makes the
# existing transitive dependency explicit.
sha2 = "0.10"
# The atomic half of `write_file` (F26): a named temp file in the target's own
# directory, `persist`ed over it. Doing this by hand means inventing a unique
# name, cleaning it up on every early return, and getting the rename right.
tempfile = "3"

# WebKitGTK's `web-process-terminated`, which is the only warning we get that
# the renderer has died (ADR-0059). The same version wry already builds — the
# `WebView` handle `with_webview` hands us is that crate's type, so a different
# major would not unify. Linux only: `WKWebView`'s equivalent is a delegate
# method wry does not surface.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

# Windows Recycle Bin calls initialize COM in native worker threads (ADR-0074).
[target.'cfg(windows)'.dependencies]
dunce = "1"
trash = { version = "5.2.6", default-features = false, features = ["coinit_multithreaded"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Environment"] }

[dev-dependencies]
regex = "1.13.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
